lead: "Analysis and design of control systems in which a digital computer closes the loop, from the sampler and the _z_-transform to networks of agents that update every _T_ seconds."

description:
  - "These notes cover the analysis and design of control systems in which a digital computer closes the loop. I wrote them for EECE 5610 Digital Control Systems, a graduate course in the Department of Electrical and Computer Engineering at Northeastern University."
  - "One thread runs through them. A computer sees the plant only every _T_ seconds and acts on it through a hold. The sampling period _T_ is therefore a design parameter, not a detail of the implementation. Chapter 1 has a loop that works with a fast computer and fails with a slow one, and later chapters explain why. The last chapter carries the same question to networks of agents, where a denser network, with more communication links, can need faster agents."
  - "Every chapter has a companion Python notebook that reproduces its main examples and runs in a web browser, with no installation. Change a gain or a sampling period and see what happens."

prerequisites: "A first course in continuous-time feedback control: transfer functions, block diagrams, root locus and Bode plots. The Laplace transform is reviewed in Appendix A. Chapters 14 and 16 also use basic linear algebra."
credit: "Chapters 1–11 are based on the handwritten lecture notes of Prof. Mario Sznaier."

parts:
  - first: 1
    last: 2
    name: "Foundations"
    summary: "What changes when a computer closes the loop, the plant models used later, and block diagrams with Mason's gain formula."
  - first: 3
    last: 7
    name: "Sampled signals"
    summary: "The _z_-transform and its inverse, difference equations and state variables, the sampler and the starred transform, aliasing, and data holds."
  - first: 8
    last: 11
    name: "Sampled-data loops"
    summary: "Open- and closed-loop pulse transfer functions, the modified _z_-transform, time response, steady-state accuracy and stability."
  - first: 12
    last: 15
    name: "Design and implementation"
    summary: "Root locus and frequency response, controller design by emulation and directly in _z_, state-space design, and the practical side: sampling period, delay, quantization and saturation."
  - first: 16
    last: 16
    name: "Networked agents"
    summary: "How fast networked agents must update, from the stability tests of Chapter 11 and the noise analysis of Chapter 15."

chapters:
