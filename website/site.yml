    reproduces: "E(z) of 1/((s + 1)(s + 2)) at _T_ = 0.5 s; the pulse transfer function of a zero-order hold and 1/(s + 1) by brute force and by exact discretization, its step samples and DC gain; where the samplers sit; the digital-filter example; how large _T_ may be for 25/(s² + 2s + 25), with the true peak against the samples."
  - number: 9
    slug: "ch09"
    title: "The Modified _z_-Transform and Closed-Loop Systems"
    summary: "Seeing between the samples, delays that are not whole periods, and closing the loop with two signal flow graphs and Mason's gain formula."
    notebook: "notebooks/ch09.ipynb"
    python: "python/ch09_modified_z.py"
    matlab: "matlab/ch09_modified_z.m"
    video: ""
