    reproduces: "The robot-arm position loop (the closed loop 25/(s² + 6s + 25) and the effect of the motor inductance); a general routine for Mason's gain formula (paths, loops, the determinant, cofactors) checked against the node equations on three examples and on the rate-feedback loop."
  - number: 3
    slug: "ch03"
    title: "Discrete-Time Systems and the _z_-Transform"
