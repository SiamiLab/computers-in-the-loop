    matlab: "matlab/ch01_laser_loop.m"
    video: ""
    figure: "python/figures/ch01_laser_step.png"
    figure_alt: "Step responses of the digital laser loop for several sampling periods, next to the analog design."
    reproduces: "The laser example: the analog integral design (a = 2, K = 1, 2% settling time 5.83 s); the same controller on a computer, simulated for _T_ = 0.1 to 2.5 s (step and disturbance peaks, size of the closed-loop roots, the limit _T_ = 4/a = 2 s); the phase margin from the delay estimate and from the sampled loop; the 12-bit quantization step."
  - number: 2
    slug: "ch02"
    title: "Block Diagrams and Mason's Gain Formula"
    summary: "A position loop for a robot arm, signal flow graphs and Mason's gain formula, and one block diagram solved both ways."
