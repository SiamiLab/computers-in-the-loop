  - number: 11
    slug: "ch11"
    title: "Stability of Sampled-Data Systems"
    summary: "Every closed-loop pole inside the unit circle, and how to test that without solving for the poles: the bilinear transformation with Routh–Hurwitz, and Jury's test."
