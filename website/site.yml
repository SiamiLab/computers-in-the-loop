  - number: 4
    slug: "ch04"
    title: "Difference Equations and the Inverse _z_-Transform"
    summary: "Convolution, difference equations and the transfer function; inverting a _z_-transform by partial fractions, power series and residues; Parseval's theorem."
    notebook: "notebooks/ch04.ipynb"
    python: "python/ch04_inverse_z.py"
    matlab: "matlab/ch04_inverse_z.m"
    video: ""
    figure: "python/figures/ch04_convolution_parseval.png"
    figure_alt: "A discrete convolution and the integrand of Parseval's theorem."
    reproduces: "One convolution two ways; a difference equation with a step input; z/((z − 1)(z − 2)) inverted by partial fractions, long division and residues; the repeated-pole example; Parseval's theorem; the practice-exercise inversion."
  - number: 5
    slug: "ch05"
