    summary: "From a transfer function to a diagram we can build, the state variables its delays hold, and the sample-and-hold as an ideal sampler followed by a zero-order hold."
    notebook: "notebooks/ch05.ipynb"
    python: "python/ch05_realizations.py"
    matlab: "matlab/ch05_realizations.m"
    video: ""
    figure: "python/figures/ch05_realizations.png"
    figure_alt: "Step response of one transfer function run three ways, and two different signals with the same samples."
    reproduces: "G(z) = (z + 0.5)/(z² − 0.75z + 0.125) run as the direct form, the two-delay form and the state equations, which all give the same output; C(zI − A)⁻¹B = G(z); the sampled-signal table on 1/((s + 1)(s + 2)) with _T_ = ln 2; a ramp through the hold and the bound on the hold error."
  - number: 6
    slug: "ch06"
    title: "The Starred Transform, Aliasing, and the Zero-Order Hold"
    summary: "The ideal sampler and the starred transform, the sampling theorem, aliasing, hidden oscillations, and the zero-order hold in time and in frequency."
