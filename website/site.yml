    reproduces: "Starred transforms by series and by residues; an example with a delay, where residues on E(s) as it stands give wrong samples and taking the delay out first fixes them; aliasing (7 Hz and 3 Hz sampled at 10 Hz) and hidden oscillations; the gain and phase of the zero-order hold at 1 Hz and 5 Hz for _T_ = 0.1 s."
  - number: 7
    slug: "ch07"
    title: "Data Reconstruction and Data Holds"
    summary: "Turning samples back into a signal: the zero-order, first-order and fractional-order holds, and the phase each one costs."
    notebook: "notebooks/ch07.ipynb"
    python: "python/ch07_holds.py"
    matlab: "matlab/ch07_holds.m"
    video: ""
    figure: "python/figures/ch07_holds.png"
    figure_alt: "A signal reconstructed by three data holds, and the magnitudes of the holds."
    reproduces: "Gain and phase of the zero-order, fractional-order (β = 0.5) and first-order holds at ωT = 0.5 and at half the sampling frequency; the frequency where the lags of the zero- and first-order holds are equal; the peak gain of the first-order hold; the images of a held sinusoid; the low-frequency delay (1 − β)_T_/2."
  - number: 8
    slug: "ch08"
    title: "Open-Loop Sampled-Data Systems"
    summary: "From the starred transform to E(z), the pulse transfer function, where the samplers sit, digital filters, and how large _T_ may be."
