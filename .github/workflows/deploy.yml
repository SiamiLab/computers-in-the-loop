# Build the companion website and publish it with GitHub Pages.
# Runs on every push to main (and by hand from the Actions tab).
# Repository layout expected (the companion/ folder is the repository root):
#   notebooks/  python/  matlab/ (optional)  website/
# In the repository settings, set Pages > Build and deployment > Source to "GitHub Actions".

name: Deploy the companion website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          pip install jupyterlite-core jupyterlite-pyodide-kernel pyyaml

      - name: Build the in-browser notebooks (JupyterLite)
        run: jupyter lite build --contents notebooks --output-dir _site/lite

      - name: Build the web pages
        run: python website/build_site.py --out _site --no-copy

      - name: Copy the notebooks and scripts
        run: |
          cp -r notebooks _site/notebooks
          cp -r python _site/python
          if [ -d matlab ]; then cp -r matlab _site/matlab; fi
          find _site -name "__pycache__" -type d -prune -exec rm -rf {} +

      - name: Check the links
        run: python website/check_links.py _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
